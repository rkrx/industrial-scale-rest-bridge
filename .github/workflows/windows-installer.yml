name: Build Windows installer
run-name: Windows installer 1.0.${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALLER_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '9.0.x'

      - name: Test configuration import on Windows PowerShell 5.1
        run: .\tests\installer\test-settings.ps1

      - name: Build standalone application and Inno Setup installer
        run: .\scripts\build-installer.ps1 -Version $env:INSTALLER_VERSION

      - name: Test installation, service, REST endpoint, upgrade and uninstall
        env:
          # Keep GetTempPath() test artifacts inside the directory uploaded below.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $installer = Join-Path $PWD "dist/installers/IndustrialScaleRestBridge-$env:INSTALLER_VERSION-win-x64-setup.exe"
          .\tests\installer\test-windows-installer.ps1 -InstallerPath $installer -AllowServiceChanges

      - name: Upload tested installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: IndustrialScaleRestBridge-${{ env.INSTALLER_VERSION }}-win-x64
          path: dist/installers/IndustrialScaleRestBridge-${{ env.INSTALLER_VERSION }}-win-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-installer-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scale-installer-test-*/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish installer release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tested installer from this run
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GH_REPO" \
            --name "IndustrialScaleRestBridge-$INSTALLER_VERSION-win-x64" \
            --dir dist/installers

      - name: Publish version tag, release and installer download
        shell: bash
        run: |
          installer="dist/installers/IndustrialScaleRestBridge-$INSTALLER_VERSION-win-x64-setup.exe"
          test -f "$installer"
          # Create atomically: a colliding tag must not attach this EXE to another commit.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$INSTALLER_VERSION" \
            -f "sha=$GITHUB_SHA" --silent
          gh release create "v$INSTALLER_VERSION" "$installer" \
            --repo "$GH_REPO" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Industrial Scale REST Bridge $INSTALLER_VERSION" \
            --generate-notes
