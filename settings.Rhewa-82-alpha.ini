[service]
listen = http://127.0.0.1:5000
test-mode = false
test-mode-response = "   1.210<GN>"

[scale]
; Adjust to the connected serial port (e.g. COM3 on Windows).
com-port = /dev/cu.usbserial-B001N1MA
baud-rate = 9600
data-bits = 8
parity = None
dtr-enable = true
rts-enable = true
handshake = RequestToSend

trigger-code-byte-hex = 3C474E313E

scale-response-start-index = 0
scale-response-part-length = 8
scale-response-unit = kilogram
scale-response-eot = "<GN>"
